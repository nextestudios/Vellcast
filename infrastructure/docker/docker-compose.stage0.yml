# Exemplo local: docker compose -f infrastructure/docker/docker-compose.stage0.yml up --build
services:
  stage0:
    build:
      context: ../..
      dockerfile: infrastructure/docker/stage0.Dockerfile
      args:
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:-}
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8787 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 15s
      timeout: 3s
      retries: 3
