# cargo-deny (OC-T02): licenças, avisos de segurança, duplicatas e origens.
# CI: job "Licenças e segurança" em .github/workflows/ci.yml.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = false

[advisories]
# RustSec: vulnerabilidades e crates sem manutenção.
version = 2
ignore = [
  # quick-xml 0.38 (RUSTSEC-2026-0194/0195) e ttf-parser (RUSTSEC-2026-0192, sem
  # manutenção, sem versão segura) só entram pela pilha Linux/Wayland do Slint
  # (accesskit_unix → zbus_xml; sctk-adwaita). O app desktop é distribuído apenas
  # para Windows, e o zbus lê XML do D-Bus local, não de entrada remota.
  # Reavaliar ao atualizar o Slint ou ao portar o desktop para Linux (C-015).
  { id = "RUSTSEC-2026-0194", reason = "somente Linux/Wayland do Slint; desktop distribuído só para Windows" },
  { id = "RUSTSEC-2026-0195", reason = "somente Linux/Wayland do Slint; desktop distribuído só para Windows" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser sem manutenção, sem versão segura; só decorações Wayland" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "MPL-2.0",
  "OFL-1.1",
]
# Slint tem licenciamento múltiplo (GPL-3.0-only OR Royalty-free-2.0 OR Software-3.0).
# O Vellcast usa a Royalty-free 2.0 (ADR-006); as outras opções não são aceitas
# para o restante da árvore.
exceptions = [
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "slint" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "slint-build" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "slint-macros" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-core" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-common" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-compiler" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-backend-selector" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-backend-winit" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-renderer-software" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-renderer-femtovg" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "i-slint-core-macros" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "vtable" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "vtable-macro" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "const-field-offset" },
  { allow = ["GPL-3.0-only", "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0"], crate = "const-field-offset-macro" },
]
# Licenças desconhecidas ou ausentes falham o job.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
# Duplicatas (ex.: tungstenite 0.29/0.30) aparecem como aviso, não erro (E3-T14).
multiple-versions = "warn"
# Dependências internas do workspace são declaradas por caminho (sem versão).
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
