name: CI

# Um único job Linux (o mais barato em minutos do Actions): lint, testes, build do player, licenças e segredos.
# O Windows não roda em pull requests: o código só de Windows é verificado localmente (cargo xwin check) e
# compilado, testado e aberto de verdade no workflow Release. Roda em todo pull request para develop ou main.
on:
  # Antes da 1.0: PRs de feature/* e hotfix/* vão direto para a main. A partir da 1.0 (Gitflow): feature/* → develop,
  # release/* e hotfix/* → main. Pushes em outras branches não rodam CI.
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, testes, player, licenças e segredos (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # GilRs (crates/controller) precisa de libudev no Linux.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --all -- --check
      # O app desktop é alvo Windows (bandeja e janela nativas); no Linux ele fica fora do lint e dos testes.
      - run: cargo clippy --workspace --exclude vellcast-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude vellcast-desktop --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/discord-activity/package-lock.json
      - name: Player web e licenças npm
        working-directory: apps/discord-activity
        run: |
          npm ci
          npm run build
          npx --yes license-checker-rseidelsohn@5.0.1 --production --summary --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"

      # OC-T02: licenças compatíveis, avisos do RustSec, duplicatas e origens.
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses advisories bans sources

      # OC-T07: nenhum segredo no histórico do git (falsos positivos em .gitleaksignore).
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .
