name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows é a plataforma-alvo do desktop; Linux é a do relay.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # GilRs (crates/controller) precisa de libudev no Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --all -- --check
      # O app desktop é alvo Windows (bandeja e janela nativas); no Linux
      # ele fica fora do lint e dos testes.
      - name: Clippy
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then EXCLUDE="--exclude vellcast-desktop"; fi
          cargo clippy --workspace $EXCLUDE --all-targets --locked -- -D warnings
      - name: Testes
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then EXCLUDE="--exclude vellcast-desktop"; fi
          cargo test --workspace $EXCLUDE --locked
      - name: Build Release do desktop
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p vellcast-desktop
      # Informativo: o runner não tem GPU nem sessão interativa garantida.
      # Registra o que a captura e o encoder encontram em um Windows real.
      - name: Diagnóstico de captura e encoder (informativo)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cargo run --locked -p vellcast-core --example capture_to_file -- list
          cargo test --locked -p vellcast-encoder --test windows_encoder -- --ignored --nocapture

  activity:
    name: Discord Activity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/discord-activity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/discord-activity/package-lock.json
      - run: npm ci
      - run: npm run build

  # OC-T02: licenças compatíveis, avisos do RustSec, duplicatas e origens.
  licenses:
    name: Licenças e segurança das dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses advisories bans sources
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Licenças npm do player
        working-directory: apps/discord-activity
        run: |
          npm ci
          npx --yes license-checker-rseidelsohn@5.0.1 --production --summary --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"

  # OC-T07: nenhum segredo no histórico do git (falsos positivos em .gitleaksignore).
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .
