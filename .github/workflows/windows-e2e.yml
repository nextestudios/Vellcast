name: Windows E2E

# Validação de ponta a ponta em um Windows real (runner do GitHub, sem GPU):
# captura WGC → encoder Media Foundation → relay → espectadores autenticados,
# captura de áudio WASAPI e o app desktop renderizando as 8 telas.
# Em push roda uma sessão curta; manualmente aceita uma duração longa (M-025).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: Duração da transmissão principal em segundos (3600 = teste de estabilidade de 60 min)
        default: "60"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: E2E Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build (Release)
        run: |
          cargo build --release --locked -p vellcast-relay
          cargo build --release --locked -p vellcast-core --example stream_to_relay --example capture_to_file
          cargo build --release --locked -p vellcast-audio --example capture_audio
          cargo build --release --locked -p vellcast-desktop --features dev-snapshot

      - name: Fontes e encoders
        run: |
          Start-Process notepad
          Start-Sleep -Seconds 3
          target\release\examples\capture_to_file.exe list | Tee-Object -FilePath sources.txt

      - name: Captura de monitor e de janela → H.264
        run: |
          $lines = Get-Content sources.txt
          $mon = ($lines | Select-String '^\s*\[(\d+)\].*Monitor' | Select-Object -First 1).Matches[0].Groups[1].Value
          $win = ($lines | Select-String '^\s*\[(\d+)\].*(?i)notepad' | Select-Object -First 1)
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          target\release\examples\capture_to_file.exe $mon 8 e2e-out\monitor.h264 30 3000
          if ($LASTEXITCODE -ne 0) { throw "captura de monitor falhou" }
          if ($win) {
            $idx = $win.Matches[0].Groups[1].Value
            target\release\examples\capture_to_file.exe $idx 8 e2e-out\janela.h264 30 3000
            if ($LASTEXITCODE -ne 0) { throw "captura de janela falhou" }
          } else { Write-Output "janela do Bloco de Notas não encontrada na lista" }
          Get-ChildItem e2e-out | Format-Table Name, Length
          foreach ($f in Get-ChildItem e2e-out\*.h264) {
            if ($f.Length -lt 1000) { throw "$($f.Name) vazio" }
            $head = [System.IO.File]::ReadAllBytes($f.FullName)[0..5]
            Write-Output "$($f.Name): $($f.Length) bytes, início $([BitConverter]::ToString($head))"
          }

      - name: Captura de áudio WASAPI (informativo)
        continue-on-error: true
        run: |
          Get-Service Audiosrv -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
          $env:RUST_LOG = "debug"
          & target\release\examples\capture_audio.exe system 5 e2e-out\audio.opus 2>&1 | Out-String | Write-Output
          Write-Output "código de saída: $LASTEXITCODE"
          Get-ChildItem e2e-out\audio.opus -ErrorAction SilentlyContinue | Format-Table Name, Length

      # Relay e testes no mesmo passo: no Windows, o runner encerra os processos
      # iniciados por um passo quando ele termina.
      - name: Transmissão de ponta a ponta (relay + monitor + janela)
        run: |
          $env:VELLCAST_RELAY_SECRET = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          $env:VELLCAST_BIND = "127.0.0.1:8788"
          $env:RUST_LOG = "info"
          $relay = Start-Process target\release\vellcast-relay.exe -PassThru -NoNewWindow -RedirectStandardOutput relay.out.log -RedirectStandardError relay.err.log
          $env:VELLCAST_E2E_RELAY_PID = "$($relay.Id)"
          Start-Sleep -Seconds 2
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8788/healthz).Content

          # 20 FPS: o runner (2 vCPUs, sem GPU) codifica por software; o teste verifica o
          # pipeline, não a capacidade da máquina.
          node tests/e2e/windows-e2e.mjs target\release\examples\stream_to_relay.exe ${{ inputs.seconds || '60' }} 3 20 3000 system monitor
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          $win = (Get-Content sources.txt | Select-String '^\s*\[(\d+)\].*(?i)notepad' | Select-Object -First 1)
          if ($win) {
            node tests/e2e/windows-e2e.mjs target\release\examples\stream_to_relay.exe 20 2 20 2000 off $win.Matches[0].Groups[1].Value
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } else { Write-Output "sem janela do Bloco de Notas; transmissão de janela pulada" }

          # S-001: console rolando texto (janela própria via conhost) gera tráfego real no
          # monitor; a subida passa por um proxy limitado a 300 kbps.
          $console = Start-Process conhost.exe -ArgumentList 'pwsh -NoProfile -Command "while ($true) { 1..400 | Get-Random -Count 40 | Out-String -Width 400; Start-Sleep -Milliseconds 15 }"' -PassThru
          Start-Sleep -Seconds 4
          node tests/e2e/abr-check.mjs target\release\examples\stream_to_relay.exe monitor 300 45
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          Stop-Process -Id $console.Id -ErrorAction SilentlyContinue

          # S-002: modo competitivo com a CPU sobrecarregada (loops ocupando todos os núcleos).
          $stress = @()
          foreach ($i in 1..([Environment]::ProcessorCount * 2)) {
            $stress += Start-Process pwsh -ArgumentList '-NoProfile','-Command','while ($true) { [math]::Sqrt(12345) | Out-Null }' -PassThru -WindowStyle Hidden
          }
          node tests/e2e/competitive-check.mjs target\release\examples\stream_to_relay.exe monitor 45
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          $stress | ForEach-Object { Stop-Process -Id $_.Id -ErrorAction SilentlyContinue }

          Stop-Process -Id $relay.Id -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }

      - name: App desktop — telas renderizadas no Windows
        run: |
          New-Item -ItemType Directory -Force e2e-out\telas | Out-Null
          foreach ($page in 0..7) {
            $env:VELLCAST_DEV_SNAPSHOT = "$PWD\e2e-out\telas\tela-$page.bmp"
            $env:VELLCAST_DEV_PAGE = "$page"
            $p = Start-Process target\release\vellcast-desktop.exe -PassThru -Wait
            Write-Output "tela $page → código $($p.ExitCode)"
          }
          $env:VELLCAST_DEV_PAGE = "4"
          $env:VELLCAST_DEV_MODAL = "keyboard"
          $env:VELLCAST_DEV_SNAPSHOT = "$PWD\e2e-out\telas\teclado-virtual.bmp"
          Start-Process target\release\vellcast-desktop.exe -Wait
          Get-ChildItem e2e-out\telas | Format-Table Name, Length
          if ((Get-ChildItem e2e-out\telas\*.bmp).Count -lt 9) { throw "nem todas as telas foram capturadas" }

      - name: App desktop — transmissão pelo próprio app (servidor de testes)
        run: |
          $base = "https://vellcast.nextestudios.com"
          $before = (Invoke-RestMethod "$base/metrics").publisherSessionsTotal
          $env:VELLCAST_DEV_AUTOSTREAM = "1"
          $env:VELLCAST_DEV_PAGE = "3"
          $env:VELLCAST_DEV_WAIT_MS = "25000"
          $env:VELLCAST_DEV_SNAPSHOT = "$PWD\e2e-out\telas\ao-vivo-transmitindo.bmp"
          $env:RUST_LOG = "info"
          $p = Start-Process target\release\vellcast-desktop.exe -PassThru -Wait -RedirectStandardError desktop-stream.log
          Remove-Item Env:VELLCAST_DEV_AUTOSTREAM, Env:VELLCAST_DEV_WAIT_MS
          Get-Content desktop-stream.log -Tail 30 -ErrorAction SilentlyContinue
          $after = (Invoke-RestMethod "$base/metrics").publisherSessionsTotal
          Write-Output "sessões de transmissor no servidor: antes $before, depois $after"
          if ($after -le $before) { throw "o app não chegou a transmitir para o servidor" }
          "### Transmissão pelo app desktop`n`nSessões de transmissor no servidor de testes: $before → $after" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: App desktop — CPU e RAM ociosos
        run: |
          Remove-Item Env:VELLCAST_DEV_SNAPSHOT, Env:VELLCAST_DEV_PAGE -ErrorAction SilentlyContinue
          $p = Start-Process target\release\vellcast-desktop.exe -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh(); $cpu0 = $p.TotalProcessorTime.TotalMilliseconds; $t0 = Get-Date
          $samples = @()
          foreach ($i in 1..6) { Start-Sleep -Seconds 5; $p.Refresh(); $samples += [math]::Round($p.WorkingSet64 / 1MB, 1) }
          $p.Refresh(); $cpu1 = $p.TotalProcessorTime.TotalMilliseconds; $secs = ((Get-Date) - $t0).TotalSeconds
          $cores = [Environment]::ProcessorCount
          $cpuPct = [math]::Round(($cpu1 - $cpu0) / ($secs * 1000) * 100, 2)
          $private = [math]::Round($p.PrivateMemorySize64 / 1MB, 1)
          Stop-Process -Id $p.Id
          $msg = "CPU ociosa: $cpuPct% de 1 núcleo ($cores núcleos) | working set (MB): $($samples -join ', ') | memória privada: $private MB"
          Write-Output $msg
          "### App desktop ocioso (Windows, renderer de software)`n`n$msg" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: App desktop — iniciar minimizado na bandeja
        run: |
          $dir = Join-Path $env:APPDATA "Next Estudios\Vellcast\config"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $cfg = Join-Path $dir "settings.json"
          $backup = if (Test-Path $cfg) { Get-Content $cfg -Raw } else { $null }
          '{ "start_minimized": true, "close_to_tray": true, "config_version": 2 }' | Set-Content -Encoding utf8 $cfg
          $env:RUST_LOG = "info"
          $p = Start-Process target\release\vellcast-desktop.exe -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "o app encerrou ao iniciar minimizado" }
          $cpu0 = $p.TotalProcessorTime.TotalMilliseconds; Start-Sleep -Seconds 20; $p.Refresh()
          $cpuPct = [math]::Round(($p.TotalProcessorTime.TotalMilliseconds - $cpu0) / 20000 * 100, 2)
          $visible = $p.MainWindowHandle -ne 0
          # Diagnóstico: janelas de nível superior visíveis do processo (classe, título, tamanho).
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            public static List<string> Visible(uint target) {
              var list = new List<string>();
              EnumWindows((h, l) => { uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid == target && IsWindowVisible(h)) { var c = new StringBuilder(256); var t = new StringBuilder(256); RECT r;
                  GetClassName(h, c, 256); GetWindowText(h, t, 256); GetWindowRect(h, out r);
                  list.Add(c + " | '" + t + "' | " + (r.R - r.L) + "x" + (r.B - r.T) + " @ " + r.L + "," + r.T); }
                return true; }, IntPtr.Zero);
              return list; } }
          "@
          [Win]::Visible([uint32]$p.Id) | ForEach-Object { Write-Output "janela visível: $_" }
          $ws = [math]::Round($p.WorkingSet64 / 1MB, 1)
          Stop-Process -Id $p.Id
          if ($backup) { $backup | Set-Content -Encoding utf8 $cfg } else { Remove-Item $cfg }
          $msg = "processo ativo sem janela visível: $(-not $visible) | CPU na bandeja: $cpuPct% de 1 núcleo | working set: $ws MB"
          Write-Output $msg
          "### App na bandeja (início minimizado)`n`n$msg" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $log = Join-Path $env:LOCALAPPDATA "Next Estudios\Vellcast\data\logs\vellcast-desktop.log"
          if (-not (Test-Path $log)) { $log = (Get-ChildItem (Join-Path $env:LOCALAPPDATA "Next Estudios") -Recurse -Filter vellcast-desktop.log -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          Write-Output "log do app: $log"
          if ($log) { Copy-Item $log tray.log; Get-Content $log | Select-String -Pattern "bandeja|estado inicial|configura" | Select-Object -First 10 }
          if ($visible) {
            $noTray = Select-String -Path tray.log -Pattern "bandeja indisponível" -Quiet -ErrorAction SilentlyContinue
            if ($noTray) {
              "Sem área de notificação nesta sessão: o app mostrou a janela (fallback esperado)." | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
            } else { throw "a janela ficou visível com início minimizado e a bandeja disponível" }
          }

      - name: Logs do relay
        if: always()
        run: |
          Get-Content relay.err.log -Tail 40 -ErrorAction SilentlyContinue
          Get-Content relay.out.log -Tail 40 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: e2e-windows
          path: |
            e2e-out
            sources.txt
            relay.*.log
            desktop-stream.log
            tray.log
          retention-days: 14
