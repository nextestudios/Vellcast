name: Windows MVP

# Gera o pacote de teste (zip) e o instalador do Vellcast para Windows.
# - push em main / manual: artefatos "Vellcast-MVP-windows-x64" e "Vellcast-Setup-x64".
# - tag v*: também assina (se houver certificado), gera o manifesto de atualização
#   assinado (se houver UPDATE_SIGNING_KEY) e cria um release em rascunho.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Pacote e instalador Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/discord-activity/package-lock.json

      - name: Versão
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
            # A versão do app (CARGO_PKG_VERSION) é usada pelo verificador de atualizações.
            (Get-Content Cargo.toml) -replace '^version = ".*"$', "version = `"$v`"" | Set-Content Cargo.toml
            cargo update --workspace --offline
          } else {
            $v = "0.0.1-dev." + $env:GITHUB_SHA.Substring(0, 7)
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "versão: $v"

      - name: Build do player web
        working-directory: apps/discord-activity
        run: |
          npm ci
          npm run build

      - name: Build Release (desktop e relay)
        shell: pwsh
        run: |
          # @(...) garante um array: um if que devolve um único item vira string e o
          # splat espalharia "--locked" letra por letra.
          $locked = @(if ($env:GITHUB_REF -notlike "refs/tags/v*") { "--locked" })
          cargo build --release @locked -p vellcast-desktop -p vellcast-relay -p vellcast-release-sign

      - name: Avisos de licenças de terceiros (Rust e npm)
        shell: pwsh
        run: |
          $ver = "0.9.1"
          Invoke-WebRequest -UseBasicParsing "https://github.com/EmbarkStudios/cargo-about/releases/download/$ver/cargo-about-$ver-x86_64-pc-windows-msvc.tar.gz" -OutFile cargo-about.tgz
          tar -xzf cargo-about.tgz
          $about = Get-ChildItem -Recurse -Filter cargo-about.exe | Select-Object -First 1
          & $about.FullName generate --workspace infrastructure/licenses/about.hbs -o THIRD-PARTY-RUST.txt
          if ($LASTEXITCODE -ne 0) { throw "cargo-about falhou" }
          Push-Location apps/discord-activity
          npx --yes license-checker-rseidelsohn@5.0.1 --production --plainVertical --out ../../THIRD-PARTY-NPM.txt
          Pop-Location

      - name: Montar pacote
        shell: pwsh
        run: |
          $out = "dist/Vellcast-MVP-windows-x64"
          New-Item -ItemType Directory -Force -Path "$out/player" | Out-Null
          Copy-Item target/release/vellcast-desktop.exe, target/release/vellcast-relay.exe -Destination $out
          Copy-Item -Recurse -Path apps/discord-activity/dist/* -Destination "$out/player"
          Copy-Item -Path infrastructure/windows-mvp/* -Destination $out
          Copy-Item -Path LICENSE -Destination "$out/LICENSE.txt"
          # Avisos: resumo manual + inventário completo gerado.
          Get-Content infrastructure/windows-mvp/THIRD-PARTY-NOTICES.txt, THIRD-PARTY-RUST.txt, THIRD-PARTY-NPM.txt |
            Set-Content -Encoding utf8 "$out/THIRD-PARTY-NOTICES.txt"
          "Vellcast ${{ steps.version.outputs.version }}`r`ncommit: $env:GITHUB_SHA`r`nbuild: $(Get-Date -Format o)" | Set-Content -Encoding utf8 "$out/VERSAO.txt"
          Get-ChildItem -Recurse $out | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Assinar binários (se houver certificado)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Output "::notice::Sem certificado de assinatura de código (E8-T02): binários não assinados."
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -Last 1
          foreach ($f in "dist/Vellcast-MVP-windows-x64/vellcast-desktop.exe", "dist/Vellcast-MVP-windows-x64/vellcast-relay.exe") {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD $f
            if ($LASTEXITCODE -ne 0) { throw "falha ao assinar $f" }
          }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Verificar binários
        shell: pwsh
        run: |
          # O relay precisa subir e responder /healthz com o player servido.
          $env:VELLCAST_RELAY_INSECURE_DEV = "1"
          $env:VELLCAST_BIND = "127.0.0.1:8788"
          $env:VELLCAST_STATIC_DIR = "dist/Vellcast-MVP-windows-x64/player"
          $relay = Start-Process -FilePath dist/Vellcast-MVP-windows-x64/vellcast-relay.exe -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 2
            $health = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8788/healthz
            if ($health.Content.Trim() -ne "ok") { throw "healthz inesperado: $($health.Content)" }
            $watch = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8788/watch
            if ($watch.StatusCode -ne 200 -or $watch.Content -notmatch "<div id=`"root`">") { throw "player não servido" }
            Write-Output "relay ok; player ok"
          } finally {
            Stop-Process -Id $relay.Id -Force
          }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --version=6.6.1 --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $src = (Resolve-Path dist/Vellcast-MVP-windows-x64).Path
          $outDir = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$src" "/DOutputDir=$outDir" infrastructure/installer/vellcast.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          Get-Item dist/Vellcast-Setup-x64.exe | Format-Table Name, Length

      - name: Assinar instalador (se houver certificado)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) { exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD dist/Vellcast-Setup-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "falha ao assinar o instalador" }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Instalar, verificar e desinstalar (silencioso)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\VellcastTeste"
          $p = Start-Process dist/Vellcast-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalação falhou: $($p.ExitCode)" }
          foreach ($f in "vellcast-desktop.exe", "vellcast-relay.exe", "player\index.html", "LICENSE.txt", "THIRD-PARTY-NOTICES.txt", "unins000.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "arquivo ausente após instalar: $f" }
          }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Vellcast.lnk" -ErrorAction SilentlyContinue
          if (-not $lnk) { throw "atalho do Menu Iniciar não criado" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name Vellcast -ErrorAction SilentlyContinue
          if ($run) { throw "início automático foi ativado sem o usuário pedir" }

          $env:VELLCAST_RELAY_INSECURE_DEV = "1"
          $env:VELLCAST_BIND = "127.0.0.1:8789"
          $env:VELLCAST_STATIC_DIR = "$dir\player"
          $relay = Start-Process "$dir\vellcast-relay.exe" -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 2
            if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8789/healthz).Content.Trim() -ne "ok") { throw "relay instalado não respondeu" }
          } finally { Stop-Process -Id $relay.Id -Force; Start-Sleep -Seconds 1 }

          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "desinstalação falhou: $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\vellcast-desktop.exe") { throw "arquivos permaneceram após desinstalar" }
          if (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Vellcast.lnk" -ErrorAction SilentlyContinue) { throw "atalho permaneceu" }
          Write-Output "instalação e desinstalação silenciosas ok"

      - name: Manifesto de atualização assinado (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Vellcast-Setup-x64.exe"
          target/release/vellcast-release-sign.exe manifest $tag $url dist/Vellcast-Setup-x64.exe "Vellcast $tag" | Set-Content -Encoding utf8NoBOM -NoNewline dist/vellcast-update.json
          if (-not $env:UPDATE_SIGNING_KEY) {
            Write-Output "::warning::Sem UPDATE_SIGNING_KEY: manifesto não assinado; o app não aceitará esta atualização."
            exit 0
          }
          target/release/vellcast-release-sign.exe sign dist/vellcast-update.json
          if ($LASTEXITCODE -ne 0) { throw "falha ao assinar o manifesto" }

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vellcast-MVP-windows-x64
          path: dist/Vellcast-MVP-windows-x64
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Vellcast-Setup-x64
          path: |
            dist/Vellcast-Setup-x64.exe
            dist/vellcast-update.json
            dist/vellcast-update.json.sig
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Release em rascunho
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Vellcast-Setup-x64
          path: release
      - name: Criar release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Vellcast $GITHUB_REF_NAME" \
            --notes "Instalador assinado (quando há certificado) e manifesto de atualização. Revise antes de publicar."
