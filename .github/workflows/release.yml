name: Release

# Publique uma versão empurrando uma tag como v0.1.3 num commit da main (só quando o mantenedor pedir; PRs são
# mergeados sem gerar release). A versão do Cargo.toml precisa ser a mesma da tag (o PR "chore(release): X.Y.Z"
# atualiza as duas coisas) e o CHANGELOG.md precisa ter a seção ## [X.Y.Z], usada como notas da release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para gerar sem publicar (ex.: 0.1.3)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    # Secrets de assinatura podem ficar no ambiente "release"; com revisores obrigatórios nele, cada release espera
    # a aprovação do mantenedor antes de rodar.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitflow guard (tags só na main)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "A tag precisa apontar para um commit da main (Gitflow: release/* ou hotfix/* mergeado na main)." }

      - name: Resolver versão
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          if ($env:EVENT_NAME -eq "push") {
            $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
            if ($cargo -ne $v) { throw "Cargo.toml está na versão $cargo, mas a tag é v$v. Atualize no PR de release." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Notas da release (CHANGELOG.md)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\]\r?\n(?<notes>.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md precisa conter a seção ## [$($env:VERSION)]." }
          $notes = $match.Groups["notes"].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "A seção $($env:VERSION) do CHANGELOG.md está vazia." }
          $releaseNotes = @(
            $notes
            ""
            "### Instalação"
            ""
            'Baixe **`Vellcast-Setup-x64.exe`** abaixo e execute (instala por cima da versão anterior). Sem assinatura de código, o SmartScreen pode avisar: **Mais informações → Executar assim mesmo**.'
            ""
            "### Arquivos"
            ""
            '- `Vellcast-Setup-x64.exe` — instalador por usuário (sem administrador).'
            '- `SHA256SUMS.txt` — hash do instalador.'
            '- `vellcast-update.json` + `.sig` — manifesto de atualização assinado (Ed25519) que o app instalado confere.'
            ""
            "Histórico completo: [CHANGELOG.md](https://github.com/$($env:REPO)/blob/v$($env:VERSION)/CHANGELOG.md)"
          ) -join "`n"
          Set-Content -LiteralPath release-notes.md -Value $releaseNotes -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Suíte completa antes de publicar (a release não usa cache).
      - name: Testes
        run: cargo test --workspace --locked

      # Só builds de tag são assinados, e só quando houver certificado (E8-T02).
      - name: Modo de assinatura
        id: signing
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $sign = $env:EVENT_NAME -eq "push" -and $env:HAS_CERT -eq "true"
          if ($env:EVENT_NAME -ne "push") { Write-Output "Build manual: sem assinatura (só builds de tag são assinados)." }
          elseif (-not $sign) { Write-Output "::warning::Release sem assinatura de código: nenhum certificado configurado (E8-T02)." }
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Pacote e instalador
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ steps.signing.outputs.sign == 'true' && secrets.WINDOWS_CERT_PFX_BASE64 || '' }}
          WINDOWS_CERT_PASSWORD: ${{ steps.signing.outputs.sign == 'true' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: .\scripts\windows\Build-Package.ps1 -Version "${{ steps.version.outputs.version }}" -Sign:($env:WINDOWS_CERT_PFX_BASE64 -ne '')

      # Abre o app de verdade antes de publicar: instalar, abrir, desinstalar.
      - name: Smoke do instalador (instalar, abrir, desinstalar)
        shell: pwsh
        run: .\scripts\windows\Test-Installed.ps1 -Setup dist\Vellcast-Setup-x64.exe

      - name: Manifesto de atualização assinado
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .\scripts\windows\New-UpdateManifest.ps1 -Tag "v${{ steps.version.outputs.version }}" -Repository "${{ github.repository }}"

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Vellcast-${{ steps.version.outputs.version }}
          path: |
            dist/Vellcast-Setup-x64.exe
            dist/SHA256SUMS.txt
            dist/vellcast-update.json
            dist/vellcast-update.json.sig
          if-no-files-found: error

      - name: Publicar release no GitHub
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Vellcast ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
          files: |
            dist/Vellcast-Setup-x64.exe
            dist/SHA256SUMS.txt
            dist/vellcast-update.json
            dist/vellcast-update.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
