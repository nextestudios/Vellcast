name: Release

# Publique uma versão empurrando uma tag como v0.1.3 num commit da main (só quando o mantenedor pedir; PRs são
# mergeados sem gerar release). A versão do Cargo.toml precisa ser a mesma da tag (o PR "chore(release): X.Y.Z"
# atualiza as duas coisas). As notas vêm do CHANGELOG.en-US.md (coladas) e do CHANGELOG.md (link); os dois precisam
# da seção ## [X.Y.Z]. Versões alpha são publicadas como release normal para a mais nova aparecer como "Latest".
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para gerar sem publicar (ex.: 0.1.3)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    # Secrets de assinatura podem ficar no ambiente "release"; com revisores obrigatórios nele, cada release espera
    # a aprovação do mantenedor antes de rodar.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitflow guard (tags só na main)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "A tag precisa apontar para um commit da main (Gitflow: release/* ou hotfix/* mergeado na main)." }

      - name: Resolver versão
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = if ($env:EVENT_NAME -eq "push") { $env:REF_NAME } else { $env:INPUT_VERSION }
          $v = $v.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') { throw "Versão inválida: $v" }
          if ($env:EVENT_NAME -eq "push") {
            $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
            if ($cargo -ne $v) { throw "Cargo.toml está na versão $cargo, mas a tag é v$v. Atualize no PR de release." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Notas da release (inglês, com link para o changelog em português)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          function Get-Notes([string]$file) {
            $changelog = Get-Content -LiteralPath $file -Raw -Encoding utf8
            $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\]\r?\n(?<notes>.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
            $match = [regex]::Match($changelog, $pattern)
            if (-not $match.Success) { throw "$file precisa conter a seção ## [$($env:VERSION)]." }
            $notes = $match.Groups["notes"].Value.Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { throw "A seção $($env:VERSION) de $file está vazia." }
            return $notes
          }
          $null = Get-Notes "CHANGELOG.md"
          $en = Get-Notes "CHANGELOG.en-US.md"
          $tag = "v$($env:VERSION)"
          $releaseNotes = @(
            $en
            ""
            "### Downloads"
            ""
            '- **Installer:** `Vellcast-Setup-x64.exe` — installs the app per user (no admin); updates are verified against the signed manifest.'
            '- **Portable:** `Vellcast-Portable-x64.exe` — a single executable; keeps its data in the `Vellcast_Data` folder next to the file.'
            ''
            '`SHA256SUMS.txt` lists the SHA-256 of both downloads. `vellcast-update.json` and `vellcast-update.json.sig` are the signed (Ed25519) update manifest the installed app verifies.'
            ""
            "**Code signing policy:** [README → Code signing policy](https://github.com/$($env:REPO)/blob/$tag/README.md#code-signing-policy) · [Privacy policy](https://github.com/$($env:REPO)/blob/$tag/docs/PRIVACY.md)"
            ""
            "---"
            ""
            "🇧🇷 Notas em português: [CHANGELOG.md](https://github.com/$($env:REPO)/blob/$tag/CHANGELOG.md)"
          ) -join "`n"
          Set-Content -LiteralPath release-notes.md -Value $releaseNotes -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Sem cargo test aqui: os testes rodam na CI (Linux) e localmente; repetir no Windows dobraria a compilação.
      # O que só existe no Windows é validado abaixo: build Release, relay do pacote e o app aberto de verdade.

      # Só builds de tag são assinados, e só quando houver certificado (E8-T02).
      - name: Modo de assinatura
        id: signing
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $sign = $env:EVENT_NAME -eq "push" -and $env:HAS_CERT -eq "true"
          if ($env:EVENT_NAME -ne "push") { Write-Output "Build manual: sem assinatura (só builds de tag são assinados)." }
          elseif (-not $sign) { Write-Output "::warning::Release sem assinatura de código: nenhum certificado configurado (E8-T02)." }
          "sign=$($sign.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Pacote e instalador
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ steps.signing.outputs.sign == 'true' && secrets.WINDOWS_CERT_PFX_BASE64 || '' }}
          WINDOWS_CERT_PASSWORD: ${{ steps.signing.outputs.sign == 'true' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: .\scripts\windows\Build-Package.ps1 -Version "${{ steps.version.outputs.version }}" -Sign:($env:WINDOWS_CERT_PFX_BASE64 -ne '')

      # Abre o app de verdade antes de publicar: o portátil e a versão instalada (instalar, abrir, desinstalar).
      - name: Smoke do portátil (abrir)
        shell: pwsh
        run: .\scripts\windows\Test-Portable.ps1 -Exe dist\Vellcast-Portable-x64.exe

      - name: Smoke do instalador (instalar, abrir, desinstalar)
        shell: pwsh
        run: .\scripts\windows\Test-Installed.ps1 -Setup dist\Vellcast-Setup-x64.exe

      - name: Manifesto de atualização assinado
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .\scripts\windows\New-UpdateManifest.ps1 -Tag "v${{ steps.version.outputs.version }}" -Repository "${{ github.repository }}"

      - name: Upload dos artefatos
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Vellcast-${{ steps.version.outputs.version }}
          path: |
            dist/Vellcast-Setup-x64.exe
            dist/Vellcast-Portable-x64.exe
            dist/SHA256SUMS.txt
            dist/vellcast-update.json
            dist/vellcast-update.json.sig
          if-no-files-found: error

      - name: Publicar release no GitHub
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Vellcast ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          append_body: false
          body_path: release-notes.md
          files: |
            dist/Vellcast-Setup-x64.exe
            dist/Vellcast-Portable-x64.exe
            dist/SHA256SUMS.txt
            dist/vellcast-update.json
            dist/vellcast-update.json.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
