[workspace]
resolver = "3"
members = ["crates/media-fixtures", "crates/transport", "services/relay", "crates/protocol", "services/stage0-server", "crates/controller", "apps/desktop", "crates/vellcast-core", "crates/capture", "crates/encoder", "crates/audio", "crates/entitlement", "crates/perf", "tools/release-sign"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/nextestudios/Vellcast"

[workspace.dependencies]
vellcast-protocol = { path = "crates/protocol" }
vellcast-media-fixtures = { path = "crates/media-fixtures" }
vellcast-transport = { path = "crates/transport" }
vellcast-relay = { path = "services/relay" }
vellcast-entitlement = { path = "crates/entitlement" }
vellcast-core = { path = "crates/vellcast-core" }
vellcast-capture = { path = "crates/capture" }
vellcast-encoder = { path = "crates/encoder" }
vellcast-audio = { path = "crates/audio" }
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Raízes do sistema (repositório de certificados do Windows/macOS): antivírus que
# inspecionam HTTPS instalam uma raiz própria que webpki-roots não conhece.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
