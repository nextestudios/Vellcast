# cargo-about: gera os avisos de licenças de terceiros do pacote e do instalador.
# Uso: cargo about generate --workspace infrastructure/licenses/about.hbs > THIRD-PARTY-RUST.txt
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "MPL-2.0",
  "OFL-1.1",
  "LicenseRef-Slint-Royalty-free-2.0",
  "LicenseRef-Slint-Software-3.0",
  "GPL-3.0-only",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
