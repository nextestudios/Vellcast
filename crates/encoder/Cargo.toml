[package]
name = "vellcast-encoder"
description = "Codificação H.264 por hardware via Media Foundation (Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

# Este crate usa FFI do Windows (COM/Media Foundation/Direct3D 11).
# Cada bloco `unsafe` tem um comentário `// SAFETY:` com a invariante.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
