[package]
name = "vellcast-perf"
description = "Benchmarks reproduzíveis do relay e avaliação QUIC × WebSocket (não distribuído)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vellcast-protocol.workspace = true
vellcast-relay.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Sem `[lints] workspace = true`: o alocador contador do benchmark precisa de
# `unsafe` (documentado em cada bloco). As regras do Clippy são as mesmas.
[lints.clippy]
unwrap_used = "warn"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
